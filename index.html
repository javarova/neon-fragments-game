<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹残片 · 像素深渊</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: #0a0c14;
            color: #d0e4f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(circle at 30% 40%, #1a2a40 0%, #060810 90%);
        }
        #game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(8, 16, 28, 0.92);
            backdrop-filter: blur(6px);
            border: 2px solid #2f8aba;
            border-radius: 20px;
            padding: 28px 30px;
            box-shadow: 0 0 30px rgba(47, 138, 186, 0.3), 0 30px 60px -10px rgba(0, 0, 0, 0.9);
            position: relative;
            min-height: 500px;
        }
        #game-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 22px;
            background: linear-gradient(45deg, #2f8aba, #b04fcf, #2f8aba);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
            opacity: 0.7;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .page { display: none; width: 100%; animation: fadeSlide 0.3s ease; }
        .page.active { display: block; }

        #start-screen { text-align: center; padding: 40px 10px 20px; position: relative; }
        #start-screen h1 { font-size: 28px; color: #7fc9ff; text-shadow: 0 0 30px #3a7a9a; margin-bottom: 10px; letter-spacing: 4px; }
        #start-screen .subtitle { font-size: 12px; color: #8aaccc; margin-bottom: 30px; opacity: 0.8; }
        #start-screen .version { font-size: 9px; color: #5a7a8a; margin-top: 30px; opacity: 0.6; }

        .menu-btn {
            display: block; width: 80%; max-width: 320px; margin: 12px auto;
            padding: 14px 0; background: #1d2e42; border: 2px solid #2e506a;
            color: #dfecf5; border-radius: 60px; font-size: 14px;
            font-family: inherit; cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 4px 0 #0a1118;
        }
        .menu-btn:hover { background: #2a405a; border-color: #6aacd9; transform: translateY(-3px); box-shadow: 0 8px 0 #0a1118, 0 0 30px rgba(47, 138, 186, 0.3); }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0a1118; }
        .menu-btn.back-btn { width: auto; padding: 8px 24px; font-size: 11px; margin-top: 30px; background: #2a2a3a; border-color: #4a4a5a; }
        .menu-btn.back-btn:hover { background: #3a3a4a; }

        #mode-screen { text-align: center; padding: 40px 10px 20px; }
        #mode-screen h2 { font-size: 20px; color: #f9ca6b; text-shadow: 0 0 20px #f9ca6b; margin-bottom: 30px; }
        #mode-screen .mode-desc { font-size: 11px; color: #8aaccc; margin: 8px 0 20px; }

        #achievement-screen, #archive-screen { padding: 20px 10px; }
        #achievement-screen h2, #archive-screen h2 {
            font-size: 20px; text-align: center; margin-bottom: 30px;
        }
        #achievement-screen h2 { color: #f9ca6b; text-shadow: 0 0 20px #f9ca6b; }
        #archive-screen h2 { color: #b5a6ff; text-shadow: 0 0 20px #b5a6ff; }

        .achievement-item {
            background: #0b141e; border: 1px solid #2a4a62; border-radius: 40px;
            padding: 14px 20px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px;
        }
        .achievement-item.locked { opacity: 0.5; filter: grayscale(0.8); }
        .achievement-item .icon { font-size: 28px; width: 48px; text-align: center; }
        .achievement-item .info { flex: 1; }
        .achievement-item .info .name { font-size: 13px; color: #d0e4f0; }
        .achievement-item .info .desc { font-size: 10px; color: #7a9ab5; margin-top: 4px; }
        .achievement-item .status { font-size: 12px; padding: 4px 14px; border-radius: 30px; background: #1a2a3a; color: #7a9ab5; }
        .achievement-item.unlocked .status { background: #2a5a3a; color: #7fdf8f; }

        .archive-data { background: #0b141e; border: 1px solid #2a4a62; border-radius: 20px; padding: 20px; font-size: 12px; line-height: 2.2; }
        .archive-data .label { color: #7a9ab5; }
        .archive-data .value { color: #d0e4f0; float: right; }
        .no-archive { text-align: center; color: #7a9ab5; padding: 30px 0; font-size: 13px; }

        #status-bar {
            display: flex; justify-content: space-between; background: #0b141e;
            padding: 10px 16px; border-radius: 40px; margin-bottom: 22px;
            border: 1px solid #1e3b52; flex-wrap: wrap; gap: 6px;
        }
        .stat-item {
            display: flex; align-items: center; gap: 6px; background: #162433;
            padding: 4px 16px; border-radius: 40px; font-size: 11px;
        }
        .stat-item span { font-weight: bold; min-width: 28px; display: inline-block; text-shadow: 0 0 8px currentColor; }
        .hp span { color: #ff7b7b; }
        .stamina span { color: #7fc9ff; }
        .fragment span { color: #f9ca6b; }
        .floor span { color: #b5a6ff; }
        .rest span { color: #a8d8a8; }

        #story-text {
            background: #0b121b; padding: 22px 20px; border-radius: 16px;
            min-height: 200px; line-height: 1.9; font-size: 13px; margin-bottom: 22px;
            border-left: 6px solid #3d7a9a;
            white-space: pre-wrap; word-break: break-word;
        }
        #story-text .highlight { color: #ffd966; }
        #story-text .danger { color: #ff6b6b; }

        #actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .action-btn {
            background: #1d2e42; border: 2px solid #2e506a; color: #dfecf5;
            padding: 12px 20px; border-radius: 40px; font-size: 12px;
            font-family: inherit; cursor: pointer; transition: all 0.25s ease;
            text-align: left; box-shadow: 0 4px 0 #0a1118;
        }
        .action-btn:hover:not(:disabled) {
            background: #2a405a; border-color: #6aacd9;
            transform: translateY(-3px); box-shadow: 0 8px 0 #0a1118;
        }
        .action-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #0a1118; }
        .action-btn:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }

        #inventory-box {
            margin-top: 4px; padding: 10px 16px; background: #0b111b;
            border-radius: 40px; font-size: 11px; display: flex; gap: 8px;
            flex-wrap: wrap; border: 1px dashed #2a4a62; color: #7a9ab5;
            align-items: center;
        }
        .inv-item {
            background: #1d3148; padding: 2px 16px; border-radius: 30px;
            color: #c3ddf5; font-size: 10px;
        }

        .game-toolbar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .game-toolbar .title {
            font-size: 14px; color: #7fc9ff; text-shadow: 0 0 20px #3a7a9a;
        }
        .game-toolbar .toolbar-btns {
            display: flex; gap: 8px;
        }
        .toolbar-btn {
            background: none; border: 1px solid #3b5a72; color: #7a9ab5;
            padding: 4px 14px; border-radius: 40px; cursor: pointer;
            font-size: 10px; font-family: inherit; transition: 0.2s;
        }
        .toolbar-btn:hover { color: #ffaeae; border-color: #8a4a4a; background: #1a1a22; }

        #hint-area {
            margin-top: 12px; padding: 10px 16px; border-radius: 40px;
            background: #1a1a2e; border: 2px solid #ff6b6b; color: #ff6b6b;
            font-size: 11px; text-align: center; display: none;
        }
        #hint-area .hint-btn {
            background: #ff6b6b; color: #0a0c14; border: none;
            padding: 4px 18px; border-radius: 40px; font-family: inherit;
            font-size: 11px; cursor: pointer; margin-left: 10px;
        }
        #hint-area .hint-btn:hover { background: #ff8a8a; }

        #lang-ball {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4a9aca, #1a4a6a);
            box-shadow: 0 0 20px rgba(47, 138, 186, 0.5), inset 0 -4px 8px rgba(0,0,0,0.6);
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            line-height: 48px;
            text-align: center;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        #lang-ball:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(47, 138, 186, 0.8);
        }
        #lang-ball .tooltip {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #d0e4f0;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            white-space: nowrap;
            border: 1px solid #2f8aba;
            pointer-events: none;
        }
        #lang-ball:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        #modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center; align-items: center;
        }
        #modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #0b141e; border: 2px solid #2f8aba; border-radius: 20px;
            padding: 30px 25px; max-width: 500px; width: 90%;
            text-align: center; box-shadow: 0 0 40px rgba(47,138,186,0.4);
            animation: fadeSlide 0.3s ease;
        }
        .modal-title {
            font-size: 16px; color: #7fc9ff; margin-bottom: 18px;
        }
        .modal-body {
            font-size: 13px; line-height: 1.8; margin-bottom: 25px; color: #d0e4f0;
        }
        .modal-actions {
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;
        }
        .modal-btn {
            padding: 10px 28px; border-radius: 40px; font-family: inherit;
            font-size: 12px; cursor: pointer; border: 2px solid #2e506a;
            background: #1d2e42; color: #dfecf5; transition: 0.2s;
            box-shadow: 0 4px 0 #0a1118;
        }
        .modal-btn:hover { background: #2a405a; border-color: #6aacd9; transform: translateY(-2px); }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0a1118; }
        .modal-btn.primary { background: #3a5a6a; border-color: #5a8aaa; }
        .modal-btn.danger { background: #6a3a3a; border-color: #8a4a4a; }
        .modal-btn.selected { background: #2a5a7a; border-color: #7fc9ff; box-shadow: 0 0 20px rgba(47,138,186,0.5); }

        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
        .flash-hp { animation: blink 0.4s ease 2; }
        .flash-stamina { animation: blink 0.4s ease 2; }
        .flash-fragment { animation: blink 0.4s ease 2; }
        #story-text .typing-cursor {
            display: inline-block; width: 6px; height: 1.2em;
            background: #7fc9ff; margin-left: 4px; animation: blink 0.8s infinite;
            vertical-align: text-bottom;
        }

        @media (max-width: 600px) {
            #game-container { padding: 16px; }
            .stat-item { font-size: 9px; padding: 2px 10px; }
            #story-text { font-size: 11px; padding: 16px; }
            .action-btn { font-size: 10px; padding: 10px 16px; }
            #inventory-box { font-size: 9px; }
            #start-screen h1 { font-size: 20px; }
            .menu-btn { font-size: 12px; }
            .modal-box { padding: 20px; }
            .modal-body { font-size: 11px; }
            #lang-ball { width: 40px; height: 40px; font-size: 20px; line-height: 40px; }
        }
    </style>
</head>
<body>
<div id="game-container">

    <!-- ===== 开始界面 ===== -->
    <div id="start-screen" class="page active">
        <h1 id="lang-title">✦ 霓虹残片</h1>
        <div class="subtitle" id="lang-subtitle">赛博公主 · 记忆回廊</div>
        <button class="menu-btn" id="btn-start" data-key="btn_start">▶ 开始游戏</button>
        <button class="menu-btn" id="btn-archive" data-key="btn_archive">📂 查看档案</button>
        <button class="menu-btn" id="btn-achievements" data-key="btn_achievements">🏆 成就</button>
        <button class="menu-btn" id="btn-announce" data-key="btn_announce">📢 公告</button>
        <div class="version" id="lang-version">V0.42.3 制作人 Javarova</div>
        <div id="lang-ball" title="语言 / Language">
            🌐
            <span class="tooltip">语言</span>
        </div>
    </div>

    <!-- ===== 模式选择 ===== -->
    <div id="mode-screen" class="page">
        <h2 id="mode-title">⚔️ 选择难度</h2>
        <button class="menu-btn" id="mode-easy">🌟 简单</button>
        <div class="mode-desc" id="mode-desc-easy">探索消耗 15 体力 · 成功率 60% · 休息恢复增加</div>
        <button class="menu-btn" id="mode-hard">🔥 困难</button>
        <div class="mode-desc" id="mode-desc-hard">探索消耗 25 体力 · 成功率 40% · 休息恢复减半</div>
        <button class="menu-btn" id="mode-insane">💀 吊炸天</button>
        <div class="mode-desc" id="mode-desc-insane">探索消耗 30 体力 · 成功率 30% · 休息几乎无效 · BOSS 胜率 30%</div>
        <button class="menu-btn back-btn" id="mode-back">← 返回</button>
    </div>

    <!-- ===== 游戏界面 ===== -->
    <div id="game-screen" class="page">
        <div class="game-toolbar">
            <span class="title">✦ 霓虹残片</span>
            <div class="toolbar-btns">
                <button class="toolbar-btn" id="btn-back-menu">↩ 主菜单</button>
                <button class="toolbar-btn" id="reset-btn">⟳ 重启</button>
            </div>
        </div>
        <div id="status-bar">
            <div class="stat-item hp">❤️ <span id="hp-display">20</span></div>
            <div class="stat-item stamina">⚡ <span id="stamina-display">100</span></div>
            <div class="stat-item fragment">🧩 <span id="fragment-display">0</span></div>
            <div class="stat-item floor">🏙️ <span id="floor-display">1</span>层</div>
            <div class="stat-item rest">🛌 <span id="rest-display">5</span></div>
        </div>
        <div id="story-text">正在连接神经网...</div>
        <div id="actions"></div>
        <div id="hint-area">
            <span id="hint-message"></span>
            <button class="hint-btn" id="hint-reset-btn">重启游戏</button>
        </div>
        <div id="inventory-box">📦 义体背包: <span id="inventory-list">空</span></div>
    </div>

    <!-- ===== 成就界面 ===== -->
    <div id="achievement-screen" class="page">
        <h2>🏆 成就</h2>
        <div id="achievement-list"></div>
        <button class="menu-btn back-btn" id="ach-back">← 返回</button>
    </div>

    <!-- ===== 档案界面 ===== -->
    <div id="archive-screen" class="page">
        <h2>📂 档案</h2>
        <div id="archive-content" class="archive-data"></div>
        <button class="menu-btn back-btn" id="arch-back">← 返回</button>
    </div>

    <!-- ===== 模态弹窗 ===== -->
    <div id="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">标题</div>
            <div class="modal-body" id="modal-body">内容</div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // ==================== 语言系统 ====================
        const LANG = {
            'zh': {
                title: '✦ 霓虹残片',
                subtitle: '赛博公主 · 记忆回廊',
                btn_start: '▶ 开始游戏',
                btn_archive: '📂 查看档案',
                btn_achievements: '🏆 成就',
                btn_announce: '📢 公告',
                version: 'V0.42.3 制作人 Javarova',
                mode_title: '⚔️ 选择难度',
                mode_easy: '🌟 简单',
                mode_easy_desc: '探索消耗 15 体力 · 成功率 60% · 休息恢复增加',
                mode_hard: '🔥 困难',
                mode_hard_desc: '探索消耗 25 体力 · 成功率 40% · 休息恢复减半',
                mode_insane: '💀 吊炸天',
                mode_insane_desc: '探索消耗 30 体力 · 成功率 30% · 休息几乎无效 · BOSS 胜率 30%',
                mode_back: '← 返回',
                announce_title: '📢 公告',
                announce_body: '8.1日更新内容：调整了钥匙等关键道具的爆率，新增简单难度，部分bug仍需等待后续修复---- Javarova',
                announce_btn: '我知道了',
                lang_select_title: '🌐 语言选择',
                lang_zh: '简体中文',
                lang_en: 'English',
                confirm_title: '⚠️ 确认切换',
                confirm_body: function(lang) { return '你要切换 ' + lang + ' 吗？'; },
                confirm_yes: '是',
                confirm_no: '取消',
                back_confirm_title: '⚠️ 警告',
                back_confirm_body: '你真的要离开吗？退出后将丢失当前进度。',
                back_confirm_yes: '是的',
                back_confirm_no: '我再想想',
                hint_rest: '剩余休息',
                hint_empty: '空'
            },
            'en': {
                title: '✦ Neon Fragments',
                subtitle: 'Cyber Princess · Memory Corridor',
                btn_start: '▶ Start Game',
                btn_archive: '📂 Archive',
                btn_achievements: '🏆 Achievements',
                btn_announce: '📢 Announcement',
                version: 'V0.42.3 Dev Javarova',
                mode_title: '⚔️ Select Difficulty',
                mode_easy: '🌟 Easy',
                mode_easy_desc: 'Explore cost 15 stamina · Success rate 60% · Rest recovery increased',
                mode_hard: '🔥 Hard',
                mode_hard_desc: 'Explore cost 25 stamina · Success rate 40% · Rest recovery halved',
                mode_insane: '💀 Insane',
                mode_insane_desc: 'Explore cost 30 stamina · Success rate 30% · Rest nearly useless · Boss win rate 30%',
                mode_back: '← Back',
                announce_title: '📢 Announcement',
                announce_body: 'Aug 1 Update: Adjusted key item drop rates, added Easy mode, some bugs still under repair ---- Javarova',
                announce_btn: 'Got it',
                lang_select_title: '🌐 Language',
                lang_zh: '简体中文',
                lang_en: 'English',
                confirm_title: '⚠️ Confirm Switch',
                confirm_body: function(lang) { return 'Are you sure you want to switch to ' + lang + '?'; },
                confirm_yes: 'Yes',
                confirm_no: 'Cancel',
                back_confirm_title: '⚠️ Warning',
                back_confirm_body: 'Are you sure you want to leave? Progress will be lost.',
                back_confirm_yes: 'Yes',
                back_confirm_no: 'Think again',
                hint_rest: 'Rest left',
                hint_empty: 'Empty'
            }
        };

        let currentLang = 'zh';

        function loadLanguage() {
            const saved = localStorage.getItem('game_lang');
            if (saved && (saved === 'zh' || saved === 'en')) {
                currentLang = saved;
            } else {
                currentLang = 'zh';
            }
        }

        function saveLanguage(lang) {
            localStorage.setItem('game_lang', lang);
            currentLang = lang;
        }

        function t(key, ...args) {
            const langData = LANG[currentLang];
            let text = langData[key];
            if (typeof text === 'function') {
                return text(...args);
            }
            return text || key;
        }

        function updateUILanguage() {
            document.getElementById('lang-title').innerText = t('title');
            document.getElementById('lang-subtitle').innerText = t('subtitle');
            document.getElementById('btn-start').innerText = t('btn_start');
            document.getElementById('btn-archive').innerText = t('btn_archive');
            document.getElementById('btn-achievements').innerText = t('btn_achievements');
            document.getElementById('btn-announce').innerText = t('btn_announce');
            document.getElementById('lang-version').innerText = t('version');

            document.getElementById('mode-title').innerText = t('mode_title');
            document.getElementById('mode-easy').innerText = t('mode_easy');
            document.getElementById('mode-desc-easy').innerText = t('mode_easy_desc');
            document.getElementById('mode-hard').innerText = t('mode_hard');
            document.getElementById('mode-desc-hard').innerText = t('mode_hard_desc');
            document.getElementById('mode-insane').innerText = t('mode_insane');
            document.getElementById('mode-desc-insane').innerText = t('mode_insane_desc');
            document.getElementById('mode-back').innerText = t('mode_back');
        }

        // ==================== 音效 ====================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playTone(freq, duration, type, volume) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume || 0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();

        let GAME = null;

        let state = {
            hp: 20,
            stamina: 100,
            fragments: 0,
            inventory: [],
            currentFloor: 1,
            currentScene: 'entrance',
            _ghostAccepted: false,
            _bossDefeated: false,
            totalRest: 5,
            usedRestEvents: {},
            totalExplores: 0,

        let typingTimer = null;
        let prevHp, prevStamina, prevFrag;

        function typeText(element, text, speed) {
            if (typingTimer) clearInterval(typingTimer);
            element.innerHTML = '';
            let index = 0;
            const cursor = '<span class="typing-cursor"></span>';
            element.innerHTML = cursor;
            typingTimer = setInterval(function() {
                if (index < text.length) {
                    const char = text[index];
                    if (char === '<') {
                        const end = text.indexOf('>', index);
                        if (end !== -1) {
                            const tag = text.substring(index, end + 1);
                            element.innerHTML = element.innerHTML.replace(cursor, '') + tag + cursor;
                            index = end + 1;
                            return;
                        }
                    }
                    element.innerHTML = element.innerHTML.replace(cursor, '') + char + cursor;
                    index++;
                } else {
                    element.innerHTML = element.innerHTML.replace(cursor, '');
                    clearInterval(typingTimer);
                    typingTimer = null;
                }
            }, speed || 20);
        }

        function getScene(id) {
            if (id === '__RESTART__') { resetGame(); return null; }
            return GAME.scenes[id];
        }

        function applyEvent(state, evt) {
            if (evt.hp) state.hp += evt.hp;
            if (evt.stamina) state.stamina += evt.stamina;
            if (evt.frag) state.fragments += evt.frag;
            if (evt.special === 'key' && !state.inventory.includes('加密密钥')) {
                state.inventory.push('加密密钥');
                sfxItem();
            }
            if (evt.special === 'starter' && !state.inventory.includes('核心启动器')) {
                state.inventory.push('核心启动器');
                sfxItem();
            }
            if (evt.type === 'rest_event' && evt.id) {
                state.usedRestEvents[evt.id] = true;
            }
            clamp(state);
        }

        function clamp(state) {
            if (state.fragments < 0) state.fragments = 0;
            if (state.hp < 0) state.hp = 0;
            if (state.stamina < 0) state.stamina = 0;
            if (state.hp > 35) state.hp = 35;
            if (state.stamina > 120) state.stamina = 120;
        }

        function checkCriticalHints(state) {
            const hasKey = state.inventory.includes('加密密钥');
            const hasStarter = state.inventory.includes('核心启动器');
            const hasEnoughFragments = state.fragments >= 5;
            const exploredEnough = state.totalExplores >= 15;
            if (exploredEnough && (!hasKey || !hasStarter || !hasEnoughFragments)) {
                let missing = [];
                if (!hasKey) missing.push('加密密钥');
                if (!hasStarter) missing.push('核心启动器');
                if (!hasEnoughFragments) missing.push('碎片（需5块）');
                return '⚠️ 已探索 ' + state.totalExplores + ' 次，仍未获得：' + missing.join('、') + '。建议重启游戏重新尝试。';
            }
            return null;
        }

        function render() {
            const scene = getScene(state.currentScene);
            if (!scene) return;

            if (state.hp <= 0 || state.stamina <= 0) {
                if (state.currentScene !== 'ending_death') {
                    state.currentScene = 'ending_death';
                    render();
                    return;
                }
            }

            document.getElementById('hp-display').innerText = Math.max(0, state.hp);
            document.getElementById('stamina-display').innerText = Math.max(0, state.stamina);
            document.getElementById('fragment-display').innerText = state.fragments;
            document.getElementById('floor-display').innerText = state.currentFloor || '?';
            document.getElementById('rest-display').innerText = state.totalRest;

            const invSpan = document.getElementById('inventory-list');
            if (state.inventory.length === 0) {
                invSpan.innerText = t('hint_empty');
            } else {
                invSpan.innerText = state.inventory.join('、');
            }

            let displayText = scene.text;
            if (typeof displayText === 'function') {
                displayText = displayText(state);
            }
            if (window._eventResult) {
                displayText += '\n\n---\n' + window._eventResult;
                window._eventResult = null;
            }

            const storyEl = document.getElementById('story-text');
            if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
            typeText(storyEl, displayText.replace(/\n/g, '\n'), 18);

            const actionsDiv = document.getElementById('actions');
            actionsDiv.innerHTML = '';

            if (state.hp <= 0 || state.stamina <= 0) {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = '💀 状态归零，请重启';
                btn.disabled = true;
                actionsDiv.appendChild(btn);
            } else {
                const options = scene.options || [];
                options.forEach(function(opt) {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    let available = true;
                    let btnText = opt.text;
                    if (typeof btnText === 'function') {
                        btnText = btnText(state);
                    }
                    if (opt.condition) {
                        try { available = opt.condition(state); } catch (e) { available = false; }
                    }
                    if (!available) {
                        btn.disabled = true;
                        btn.innerText = '🔒 ' + (btnText.includes('需') ? btnText : btnText + ' (条件不足)');
                    } else {
                        btn.innerText = btnText;
                        btn.onclick = function() {
                            sfxClick();
                            if (opt.next === '__RESTART__') { resetGame(); return; }
                            if (opt.next) {
                                let nextId = opt.next;
                                if (typeof nextId === 'function') {
                                    nextId = nextId(state);
                                }
                                const nextScene = getScene(nextId);
                                if (nextScene && nextScene.on_enter) {
                                    nextScene.on_enter(state);
                                }
                                state.currentScene = nextId;
                                window._triggerGhost = false;
                                render();
                                saveGame(state);
                                checkAndUnlockAchievements(state);
                            }
                        };
                    }
                    actionsDiv.appendChild(btn);
                });
            }

            const hintArea = document.getElementById('hint-area');
            const hintMsg = document.getElementById('hint-message');
            const hint = checkCriticalHints(state);
            if (hint) {
                hintArea.style.display = 'block';
                hintMsg.innerText = hint;
            } else {
                hintArea.style.display = 'none';
            }

            flashIfChanged();
        }

        function checkAndUnlockAchievements(state) {
            if (state.fragments >= 5) unlockAchievement('fragments');
            const allItems = ['加密密钥', '核心启动器', '幽灵之吻', '胜利勋章'];
            const hasAll = allItems.every(function(item) { return state.inventory.includes(item); });
            if (hasAll) unlockAchievement('all_items');
            if (state.totalExplores >= 30) unlockAchievement('explorer');
            if (state._bossDefeated && state.totalRest === 5) {
                unlockAchievement('ascetic');
            }
        }

        function resetGame() {
            const diff = state.difficulty || { exploreCost: 20, successRate: 0.5, restStamina: 15, restHP: 3, bossWinRate: 0.6, failExtraDamage: 0 };
            state = {
                hp: 20,
                stamina: 100,
                fragments: 0,
                inventory: [],
                currentFloor: 1,
                currentScene: 'entrance',
                _ghostAccepted: false,
                _bossDefeated: false,
                totalRest: 5,
                usedRestEvents: {},
                totalExplores: 0,
                difficulty: diff
            };
            window._eventResult = null;
            window._triggerGhost = false;
            const startScene = getScene(state.currentScene);
            if (startScene && startScene.on_enter) startScene.on_enter(state);
            render();
        }

        function flashIfChanged() {
            const hpEl = document.getElementById('hp-display');
            const staEl = document.getElementById('stamina-display');
            const fragEl = document.getElementById('fragment-display');
            if (prevHp !== undefined && prevHp !== state.hp) {
                hpEl.parentElement.classList.add('flash-hp');
                setTimeout(function() { hpEl.parentElement.classList.remove('flash-hp'); }, 400);
            }
            if (prevStamina !== undefined && prevStamina !== state.stamina) {
                staEl.parentElement.classList.add('flash-stamina');
                setTimeout(function() { staEl.parentElement.classList.remove('flash-stamina'); }, 400);
            }
            if (prevFrag !== undefined && prevFrag !== state.fragments) {
                fragEl.parentElement.classList.add('flash-fragment');
                setTimeout(function() { fragEl.parentElement.classList.remove('flash-fragment'); }, 400);
            }
            prevHp = state.hp;
            prevStamina = state.stamina;
            prevFrag = state.fragments;
        }

        function startGameWithMode(mode) {
            let diff;
            if (mode === 'easy') {
                diff = { exploreCost: 15, successRate: 0.6, restStamina: 20, restHP: 5, bossWinRate: 0.7, failExtraDamage: 0 };
            } else if (mode === 'hard') {
                diff = { exploreCost: 25, successRate: 0.4, restStamina: 10, restHP: 2, bossWinRate: 0.5, failExtraDamage: 0 };
            } else if (mode === 'insane') {
                diff = { exploreCost: 30, successRate: 0.3, restStamina: 5, restHP: 1, bossWinRate: 0.3, failExtraDamage: -3 };
            } else {
                diff = { exploreCost: 20, successRate: 0.5, restStamina: 15, restHP: 3, bossWinRate: 0.6, failExtraDamage: 0 };
            }

            const saved = loadGame();
            if (saved && saved.difficulty && saved.difficulty.exploreCost === diff.exploreCost) {
                state = {
                    hp: saved.hp || 20,
                    stamina: saved.stamina || 100,
                    fragments: saved.fragments || 0,
                    inventory: saved.inventory || [],
                    currentFloor: saved.currentFloor || 1,
                    currentScene: saved.currentScene || 'entrance',
                    _ghostAccepted: saved._ghostAccepted || false,
                    _bossDefeated: saved._bossDefeated || false,
                    totalRest: saved.totalRest !== undefined ? saved.totalRest : 5,
                    usedRestEvents: saved.usedRestEvents || {},
                    totalExplores: saved.totalExplores || 0,
                    difficulty: diff
                };
            } else {
                state = {
                    hp: 20,
                    stamina: 100,
                    fragments: 0,
                    inventory: [],
                    currentFloor: 1,
                    currentScene: 'entrance',
                    _ghostAccepted: false,
                    _bossDefeated: false,
                    totalRest: 5,
                    usedRestEvents: {},
                    totalExplores: 0,
                    difficulty: diff
                };
                const startScene = getScene(state.currentScene);
                if (startScene && startScene.on_enter) startScene.on_enter(state);
            }
            state.difficulty = diff;
            showPage('game-screen');
            render();
            saveGame(state);
        }

                                window._eventResult += ' 受到额外伤害 ' + (-diff.failExtraDamage) + ' HP。';
                            }
                        }
                        clamp(state);
                        return true;
                    },
                    options: [
                        { text: '继续探索', next: 'explore_5' },
                        { text: '返回实验室', next: 'floor5' }
                    ]
                },
                floor6: {
                    id: 'floor6',
                    name: '核心反应堆',
                    text: '反应堆发出低沉的嗡鸣，你感到温度急剧上升。这里必须找到「核心启动器」并击败数据守卫。',
                    on_enter: function(state) { state.currentFloor = 6; return true; },
                    options: [
                        { text: '🔍 探索反应堆（消耗体力，成功率依难度）', next: 'explore_6' },
                        { text: function(state) { return '🛌 休息（剩余 ' + state.totalRest + ' 次）'; }, next: 'rest_global', condition: function(s) { return s.totalRest > 0; } },
                        { text: '🛌 休息（已用完）', next: null, condition: function(s) { return s.totalRest <= 0; } },
                        { text: '⚔️ 挑战数据守卫（需核心启动器）', next: 'boss_fight', condition: function(s) { return s.inventory.includes('核心启动器'); } }
                    ]
                },
                explore_6: {
                    id: 'explore_6',
                    text: '你避开辐射区搜索…',
                    on_enter: function(state) {
                        const diff = state.difficulty || { exploreCost: 20, successRate: 0.5, failExtraDamage: 0 };
                        if (state.stamina < diff.exploreCost) { window._eventResult = '⚠️ 体力不足！'; return true; }
                        state.stamina -= diff.exploreCost;
                        state.totalExplores++;
                        var roll = Math.random();
                        if (roll < diff.successRate) {
                            sfxSuccess();
                            var pool = GAME.events_pool[6] || [];
                            var available = pool.filter(function(evt) {
                                if (evt.type === 'rest_event') return !state.usedRestEvents[evt.id];
                                return true;
                            });
                            if (available.length === 0) {
                                window._eventResult = '你仔细搜索，但这里已被搜刮一空。';
                            } else {
                                var evt = available[Math.floor(Math.random() * available.length)];
                                applyEvent(state, evt);
                                window._eventResult = '🎲 成功！' + evt.msg;
                                if (evt.special === 'boss_fight') {
                                    state.currentScene = 'boss_fight';
                                    render();
                                    return;
                                }
                            }
                        } else {
                            sfxFail();
                            state.stamina -= 10;
                            if (diff.failExtraDamage) state.hp += diff.failExtraDamage;
                            if (state.fragments > 0 && Math.random() < 0.4) { state.fragments--; window._eventResult = '🎲 失败... 丢失1碎片，额外-10体力。'; }
                            else { window._eventResult = '🎲 失败... 额外-10体力。'; }
                            if (diff.failExtraDamage) {
                                window._eventResult += ' 受到额外伤害 ' + (-diff.failExtraDamage) + ' HP。';
                            }
                        }
                        clamp(state);
                        return true;
                    },
                    options: [
                        { text: '继续探索', next: 'explore_6' },
                        { text: '返回反应堆', next: 'floor6' }
                    ]
                },
                boss_fight: {
                    id: 'boss_fight',
                    name: '数据守卫',
                    text: '巨大的数据实体从核心升起！你必须击败它才能开启传送门。\n（战斗消耗30体力，若体力不足则无法战斗）',
                    options: [
                        { text: '⚡ 全力攻击（消耗30体力，胜率依难度）', next: 'boss_result' },
                        { text: '🛡️ 防御姿态（消耗15体力，低胜率）', next: 'boss_result_def' }
                    ]
                },
                boss_result: {
                    id: 'boss_result',
                    text: '你发动猛攻…',
                    on_enter: function(state) {
                        const diff = state.difficulty || { bossWinRate: 0.6 };
                        if (state.stamina < 30) {
                            window._eventResult = '⚠️ 体力不足，无法攻击！';
                            state.currentScene = 'floor6';
                            render();
                            return;
                        }
                        state.stamina -= 30;
                        var win = Math.random() < diff.bossWinRate;
                        if (win) {
                            sfxSuccess();
                            state.inventory.push('胜利勋章');
                            window._eventResult = '🎉 你击溃了守卫！传送门完全开启。';
                            state._bossDefeated = true;
                            state.currentScene = 'ending_check';
                        } else {
                            sfxFail();
                            state.hp -= 10;
                            window._eventResult = '💢 守卫重创了你，你被迫撤退。';
                            clamp(state);
                            state.currentScene = 'floor6';
                        }
                        render();
                        return;
                    },
                    options: []
                },
                boss_result_def: {
                    id: 'boss_result_def',
                    text: '你采取守势…',
                    on_enter: function(state) {
                        if (state.stamina < 15) {
                            window._eventResult = '⚠️ 体力不足！';
                            state.currentScene = 'floor6';
                            render();
                            return;
                        }
                        state.stamina -= 15;
                        var win = Math.random() < 0.2;
                        if (win) {
                            sfxSuccess();
                            state.inventory.push('胜利勋章');
                            window._eventResult = '🎉 你奇迹般抵挡并反击成功！';
                            state._bossDefeated = true;
                            state.currentScene = 'ending_check';
                        } else {
                            sfxFail();
                            state.hp -= 15;
                            window._eventResult = '💀 守卫将你击倒...';
                            clamp(state);
                            state.currentScene = 'floor6';
                        }
                        render();
                        return;
                    },
                    options: []
                },
                ending_check: {
                    id: 'ending_check',
                    name: '传送门',
                    text: '你站在传送门前，碎片、密钥、启动器已集齐。',
                    options: [
                        { text: '🚪 踏入传送门（进入结局）', next: 'ending_good' }
                    ]
                },
                ending_good: {
                    id: 'ending_good',
                    name: '🏆 王座觉醒',
                    text: function(state) {
                        var extra = '';
                        if (state._ghostAccepted) {
                            extra = '\n\n数据幽灵的光球与你融为一体，你们携手登上王座。\n—— 羁绊结局 ——';
                        } else {
                            extra = '\n\n你独自坐回王座，记忆恢复，但心中空落。\n—— 孤独之王结局 ——';
                        }
                        return '传送门开启，你走入王座室。五块碎片与密钥、启动器激活了核心，\n你的记忆完全恢复——你曾是这座霓虹之都的公主，\n如今你带着所有碎片归来，重新执掌这座城市。' + extra;
                    },
                    options: [{ text: '🔄 二周目', next: '__RESTART__' }]
                },
                ending_death: {
                    id: 'ending_death',
                    name: '💀 数据崩解',
                    text: '你的体力/生命归零，意识消散。你的代码被永久删除。\n—— 虚无结局 ——',
                    options: [{ text: '🔄 重来', next: '__RESTART__' }]
                }
            }
        };

        // ==================== 事件绑定 ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadLanguage();
            updateUILanguage();

            document.getElementById('btn-start').addEventListener('click', function() {
                sfxClick();
                showPage('mode-screen');
            });
            document.getElementById('btn-archive').addEventListener('click', function() {
                sfxClick();
                renderArchive();
                showPage('archive-screen');
            });
            document.getElementById('btn-achievements').addEventListener('click', function() {
                sfxClick();
                renderAchievements();
                showPage('achievement-screen');
            });
            document.getElementById('btn-announce').addEventListener('click', function() {
                sfxClick();
                showAnnouncement();
            });
            document.getElementById('lang-ball').addEventListener('click', function() {
                sfxClick();
                showLanguageSelector();
            });

            document.getElementById('mode-easy').addEventListener('click', function() {
                sfxClick();
                startGameWithMode('easy');
            });
            document.getElementById('mode-hard').addEventListener('click', function() {
                sfxClick();
                startGameWithMode('hard');
            });
            document.getElementById('mode-insane').addEventListener('click', function() {
                sfxClick();
                startGameWithMode('insane');
            });
            document.getElementById('mode-back').addEventListener('click', function() {
                sfxClick();
                showPage('start-screen');
            });

            document.getElementById('ach-back').addEventListener('click', function() {
                sfxClick();
                showPage('start-screen');
                updateUILanguage();
            });
            document.getElementById('arch-back').addEventListener('click', function() {
                sfxClick();
                showPage('start-screen');
                updateUILanguage();
            });

            document.getElementById('reset-btn').addEventListener('click', function() {
                sfxClick();
                resetGame();
            });
            document.getElementById('hint-reset-btn').addEventListener('click', function() {
                sfxClick();
                resetGame();
            });
            document.getElementById('btn-back-menu').addEventListener('click', function() {
                sfxClick();
                backToMenu();
            });

            showPage('start-screen');

            if (!sessionStorage.getItem('announcement_shown')) {
                sessionStorage.setItem('announcement_shown', 'true');
                setTimeout(function() {
                    showAnnouncement();
                }, 300);
            }
        });
    })();
</script>
</body>
</html>
